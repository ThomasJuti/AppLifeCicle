name: customers-prod

services:

  postgres:
    image: postgres:16-alpine
    container_name: customers-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: customersdb
      POSTGRES_USER: customers_user
      POSTGRES_PASSWORD: customers_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customers_user -d customersdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: customers-app
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/customersdb
      DATABASE_USER: customers_user
      DATABASE_PASSWORD: customers_pass
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  postgres_data:
