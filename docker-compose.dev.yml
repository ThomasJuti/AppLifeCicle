name: customers-dev

services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: customers-app-dev
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      APP_HEALTH_PORT: "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
