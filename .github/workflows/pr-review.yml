name: PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Agente de revisión (reglas + IA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capa 1 — Reglas (seguridad y convenciones)
        id: rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPORT_FILE: pr-review-rules.md
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x .github/scripts/pr-review.sh
          set +e
          .github/scripts/pr-review.sh
          EXIT=$?
          set -e
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"

      - name: Capa 2 — Revisión con IA (Gemini)
        id: ai
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPORT_FILE: pr-review-ai.md
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          chmod +x .github/scripts/pr-review-ai.sh
          .github/scripts/pr-review-ai.sh

      - name: Combinar informes
        id: merge
        run: |
          {
            cat pr-review-rules.md
            echo ""
            echo "---"
            echo ""
            cat pr-review-ai.md
          } > pr-review-report.md
          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          cat pr-review-report.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publicar comentario en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-review-agent -->'
            const body = `${marker}\n${process.env.REPORT}`
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            })

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }
        env:
          REPORT: ${{ steps.merge.outputs.report }}

      - name: Fallar si hay bloqueantes (capa reglas)
        if: steps.rules.outputs.exit_code != '0'
        run: |
          echo "::error::Bloqueantes detectados (secretos/archivos sensibles). La IA no sustituye estas comprobaciones."
          exit 1
